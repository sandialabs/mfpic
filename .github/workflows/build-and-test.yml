name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build_and_test:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      packages: write

    env:
      SPACK_DISABLE_LOCAL_CONFIG: true
      SPACK_USER_CACHE_PATH: spack_cache
      SPACK_VERSION: v1.1.1
      SPACK_BUILDCACHE: oci://ghcr.io/${{ github.repository_owner }}/mfpic-spack-buildcache
      GITHUB_USER: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest]
        build_type: [Release, Debug]
        compiler: [gcc, llvm]

    steps:
    - name: Check out spack
      uses: actions/checkout@v4
      with:
        repository: spack/spack
        path: spack
        ref: ${{env.SPACK_VERSION}}

    - name: Check out mfpic
      uses: actions/checkout@v4
      with:
        path: mfpic

    - name: Configure spack
      run: |
        sudo apt install llvm libomp-dev
        . spack/share/spack/setup-env.sh
        spack config --scope site add "config:install_tree:padded_length:128"
        spack mirror add --scope site --unsigned \
          --oci-username-variable GITHUB_USER \
          --oci-password-variable GITHUB_TOKEN \
          mfpic-buildcache ${{env.SPACK_BUILDCACHE}}
        spack bootstrap now
        spack compiler find

    - name: Install dependencies
      run: |
        . spack/share/spack/setup-env.sh
        spack env create mfpic-dev
        spack env activate mfpic-dev
        spack repo add mfpic/spack_repo/mfpic
        spack add mfpic build_type=${{matrix.build_type}} %${{matrix.compiler}}
        mkdir build
        spack develop --no-clone --path $PWD/mfpic --build-directory $PWD/build mfpic
        spack concretize -f --test=root
        spack install --test=root --only=dependencies

    - name: Push dependencies to build cache
      if: ${{ github.ref_name == 'main' }}
      run: |
        . spack/share/spack/setup-env.sh
        spack -e mfpic-dev buildcache push --update-index --only=dependencies mfpic-buildcache

    - name: Build and test
      run: |
        . spack/share/spack/setup-env.sh
        spack env activate mfpic-dev
        spack install --test=root --verbose --until=build
